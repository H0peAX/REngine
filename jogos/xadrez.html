<style>
:root{--bg:#0a0a0a;--panel:#141414;--text:#f7f7f5;--dim:#9a9a9a;--line:rgba(247,247,245,.14);--line-strong:rgba(247,247,245,.32);--g:#4ade80;--red:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 64px 14px 20px;border-bottom:1px solid var(--line);font:700 16px 'Space Grotesk',sans-serif}
.top a{color:var(--dim);text-decoration:none;font:400 14px Inter,sans-serif}.top a:hover{color:var(--text)}
main{max-width:540px;margin:0 auto;padding:14px 16px 28px}
.set{display:grid;grid-template-columns:1.7fr 1fr auto;gap:8px;max-width:520px;margin:0 auto 10px}
.set label{display:flex;flex-direction:column;gap:2px;font:500 10px 'JetBrains Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.set select{width:100%;padding:8px 4px;border:1px solid var(--line);background:#1c1c1c;border-radius:6px;font:600 12px Inter,sans-serif;color:var(--text)}
.set select:focus{outline:none;border-color:var(--g)}
.set button{align-self:end;padding:9px 14px;border:1px solid var(--g);background:rgba(74,222,128,.1);color:var(--g);border-radius:6px;font:600 13px Inter,sans-serif}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:520px;margin:6px auto;min-height:26px;font:500 12px 'JetBrains Mono',monospace;color:var(--dim)}
.pl .nm{display:flex;align-items:center;gap:7px;color:var(--text);min-width:0}
.pl .nm i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line-strong);flex:none}
.pl .nm i.w{background:#f7f7f5}.pl .nm i.b{background:#151515}
.pl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .cap{font:16px/1 'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans','Apple Symbols',sans-serif;letter-spacing:-1px;white-space:nowrap;color:var(--dim)}
.pl .cap em{font:500 12px 'JetBrains Mono',monospace;font-style:normal;color:var(--g);margin-left:6px;letter-spacing:0}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(100%,max(330px,calc(100vh - 320px)));width:min(100%,max(330px,calc(100svh - 320px)));min-width:280px;max-width:520px;aspect-ratio:1;margin:0 auto;border:2px solid var(--line-strong);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;container-type:inline-size}
.sq{min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:default}
.sq.l{background-color:#b9cabe}.sq.d{background-color:#648070}
.sq.lm{background-image:linear-gradient(rgba(74,222,128,.42),rgba(74,222,128,.42))}
.sq.hnt{background-image:linear-gradient(rgba(250,204,21,.55),rgba(250,204,21,.55))}
.sq.chk{background-image:radial-gradient(circle,rgba(248,113,113,.95) 0,rgba(248,113,113,.55) 45%,rgba(248,113,113,0) 72%)}
.sq.sel{background-image:linear-gradient(rgba(74,222,128,.62),rgba(74,222,128,.62))}
.sq.t::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(10,10,10,.28);pointer-events:none}
.sq.t.cap::after{width:92%;height:92%;background:none;border:max(3px,.9cqw) solid rgba(10,10,10,.3)}
.sq.mine{cursor:pointer}
.sq.dragging .pc{opacity:.25}
.pc{font:600 9.6cqw/1 'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans','Apple Symbols','Arial Unicode MS',sans-serif;font-size:9.6cqw;pointer-events:none;position:relative;z-index:1}
.pc.w,.ghost.w{color:#fff;-webkit-text-stroke:.7px #1c1c1c;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pc.b,.ghost.b{color:#141414;text-shadow:0 0 1px rgba(255,255,255,.45)}
.ghost{position:fixed;z-index:200;pointer-events:none;line-height:1;transform:translate(-50%,-52%);font-family:'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans','Apple Symbols',sans-serif;font-weight:600}
.rk,.fl{position:absolute;font:600 max(9px,2.2cqw)/1 'JetBrains Mono',monospace;pointer-events:none}
.rk{left:3px;top:3px}.fl{right:3px;bottom:2px}
.sq.l .rk,.sq.l .fl{color:#648070}.sq.d .rk,.sq.d .fl{color:#b9cabe}
.stat{max-width:520px;margin:10px auto 0;text-align:center;font:500 12px 'JetBrains Mono',monospace;color:var(--dim);min-height:18px}
.stat.me{color:var(--g)}
.stat .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:520px;margin:8px auto 0}
.tools button{padding:9px 2px;border:1px solid var(--line);background:#1c1c1c;border-radius:8px;font:600 12px Inter,sans-serif;transition:.2s}
.tools button:hover:not(:disabled){border-color:var(--g)}
.tools button:disabled{opacity:.35;cursor:default}
.moves{max-width:520px;height:76px;margin:10px auto 0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:12px/1.7 'JetBrains Mono',monospace;color:var(--text)}
.moves .mn{color:var(--dim);margin-left:6px}.moves .mn:first-child{margin-left:0}
.moves b{font-weight:500}
.moves b.last{color:var(--g)}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:520px;margin:12px auto 0;padding:10px 12px;background:var(--panel);border:1px solid rgba(74,222,128,.3);border-radius:10px;min-height:56px}
.msg .n{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--g);white-space:nowrap;padding-top:2px}
.msg .t{font-size:14px}
.credit{max-width:520px;margin:14px auto 0;text-align:center;font:400 10px 'JetBrains Mono',monospace;color:#666}
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:22px 24px;text-align:center;max-width:340px;width:100%}
.box h2{margin:0 0 6px;font:700 21px 'Space Grotesk',sans-serif}
.box p{margin:4px 0;color:var(--dim);font-size:14px}
.box .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.box .row button{flex:1;min-width:90px;padding:10px 6px;border-radius:8px;border:1px solid var(--line-strong);background:#1c1c1c;font:600 13px Inter,sans-serif}
.box .row button.pri{border-color:var(--g);color:var(--g);background:rgba(74,222,128,.1)}
.box .row button.pp{font:600 38px/1 'Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans','Apple Symbols',sans-serif;padding:8px 0}
.box .row button.pp.w{color:#fff;-webkit-text-stroke:.8px #333}
.box .row button.pp.b{color:#9a9a9a}
@media (max-width:380px){.top{padding-left:14px}.tools button{font-size:11px}}

<script>
(function(){
'use strict';
var Chess = ChessLib.Chess;
var KEY = 'rengine.xadrez.v1';
var FILES = 'abcdefgh';
/* Nível "Magnus Carlsen": Stockfish limitado a MAGNUS_ELO (UCI_Elo, máx. 3190). Aumente para jogar mais forte, ou ponha null para força máxima do motor. */
var MAGNUS_ELO = 2850;
var LEVELS = [
  {n:'Iniciante',      e:'~600',  skill:0, depth:1, rnd:.40, intro:'Nível Iniciante. Prometo errar bastante (mas sem exagerar).'},
  {n:'Casual',         e:'~1000', skill:0, depth:2, rnd:.15, intro:'Nível Casual. Jogo sem muita pressa e sem muita pontaria.'},
  {n:'Intermediário',  e:'~1500', uci:1500, ms:300,  intro:'Nível Intermediário. Já sei o que é uma garfada, cuidado.'},
  {n:'Avançado',       e:'~2000', uci:2000, ms:700,  intro:'Nível Avançado. Aqui já não vale pedir dica de olhos fechados.'},
  {n:'Mestre',         e:'~2400', uci:2400, ms:1500, intro:'Nível Mestre. Respira fundo e calcula.'},
  {n:'Magnus Carlsen', e:'~' + MAGNUS_ELO, uci:MAGNUS_ELO, ms:3500, magnus:true, intro:'Nível Magnus Carlsen, na casa dos ' + MAGNUS_ELO + ' de Elo. Vou jogar sério. Boa sorte, você vai precisar.'}
];
var GL = {k:'\u265A', q:'\u265B', r:'\u265C', b:'\u265D', n:'\u265E', p:'\u265F'};
var VAL = {p:1, n:3, b:3, r:5, q:9, k:0};
function glyph(t){ return GL[t] + '\uFE0E'; }
function $(id){ return document.getElementById(id); }
function pick(a){ return a[(Math.random() * a.length) | 0]; }
function say(t){ $('msg').textContent = t; }

var game = new Chess(), me = 'w', lvIdx = 2, flipped = false, sel = null, targets = {}, hintMv = null;
var thinking = false, over = false, lastMove = null, sqEls = {}, drag = null, gameToken = 0, engineMoves = 0;
var boardEl = $('board'), modal = $('modal');

/* ================= motor (Stockfish em Web Worker) ================= */
var sf = null, sfState = 'loading', sfJob = null, goN = 0, bmN = 0, pend = null, sfTimer = null;
function sfSend(c){ if(sf) sf.postMessage(c); }
function sfInit(){
  try{ sf = new Worker('stockfish/stockfish-19-lite-single.js'); }catch(e){ return sfFail(); }
  sf.onmessage = function(ev){
    var l = String(ev.data || '');
    if(l === 'uciok') sfSend('isready');
    else if(l === 'readyok'){ if(sfState === 'loading'){ sfState = 'ready'; clearTimeout(sfTimer); if(sfJob){ var j = sfJob; sfJob = null; runJob(j); } } }
    else if(l.indexOf('bestmove') === 0){ bmN++; if(bmN === goN && pend){ var p = pend; pend = null; p(l.split(/\s+/)[1]); } }
  };
  sf.onerror = function(){ sfFail(); };
  sfSend('uci');
  sfTimer = setTimeout(function(){ if(sfState === 'loading') sfFail(); }, 10000);
}
function sfFail(){
  if(sfState === 'failed') return;
  sfState = 'failed'; clearTimeout(sfTimer);
  try{ if(sf) sf.terminate(); }catch(e){}
  sf = null;
  say('Não consegui carregar o Stockfish aqui. Jogo em modo reserva, bem mais fraco que o nível escolhido.');
  if(sfJob){ var j = sfJob; sfJob = null; runJob(j); }
}
function cancelSearch(){ if(pend){ pend = null; sfSend('stop'); } }
function sfSearch(o, cb){
  var job = {o:o, cb:cb};
  if(sfState === 'loading'){ sfJob = job; return; }
  runJob(job);
}
function runJob(job){
  var o = job.o;
  if(sfState === 'failed'){ setTimeout(function(){ job.cb(fallbackMove(o.fen)); }, 60); return; }
  cancelSearch();
  pend = job.cb; goN++;
  sfSend('setoption name UCI_LimitStrength value ' + (o.elo ? 'true' : 'false'));
  if(o.elo) sfSend('setoption name UCI_Elo value ' + o.elo);
  sfSend('setoption name Skill Level value ' + (o.skill == null ? 20 : o.skill));
  sfSend('position fen ' + o.fen);
  sfSend(o.depth ? 'go depth ' + o.depth : 'go movetime ' + o.ms);
}
/* motor reserva: negamax simples (só entra se o Stockfish não carregar) */
function evalSide(g){
  var b = g.board(), s = 0, V = {p:100, n:320, b:330, r:500, q:900, k:0};
  for(var r = 0; r < 8; r++) for(var c = 0; c < 8; c++){
    var p = b[r][c]; if(!p) continue;
    var v = V[p.type] + ((p.type === 'p' || p.type === 'n') ? 12 - 3 * (Math.abs(3.5 - c) + Math.abs(3.5 - r)) : 0);
    s += p.color === g.turn() ? v : -v;
  }
  return s;
}
function nm(g, d, a, b){
  if(g.isCheckmate()) return -99999;
  if(d === 0 || g.isDraw()) return d === 0 ? evalSide(g) : 0;
  var ms = g.moves({verbose:true});
  ms.sort(function(x, y){ return (y.captured ? 1 : 0) - (x.captured ? 1 : 0); });
  for(var i = 0; i < ms.length; i++){
    g.move(ms[i]); var sc = -nm(g, d - 1, -b, -a); g.undo();
    if(sc >= b) return b; if(sc > a) a = sc;
  }
  return a;
}
function fallbackMove(fen){
  var g = new Chess(fen), ms = g.moves({verbose:true}), best = null, bs = -1e9;
  ms.sort(function(){ return Math.random() - .5; });
  for(var i = 0; i < ms.length; i++){
    g.move(ms[i]); var sc = -nm(g, 2, -1e9, 1e9); g.undo();
    if(sc > bs){ bs = sc; best = ms[i]; }
  }
  return best ? best.from + best.to + (best.promotion || '') : '(none)';
}

/* ================= tabuleiro ================= */
function buildBoard(){
  var h = '', r, f;
  for(r = 0; r < 8; r++) for(f = 0; f < 8; f++){
    var file = flipped ? 7 - f : f, rank = flipped ? r : 7 - r, sq = FILES.charAt(file) + (rank + 1);
    h += '<div class="sq ' + ((file + rank) % 2 === 1 ? 'l' : 'd') + '" data-sq="' + sq + '" role="gridcell">' +
      (f === 0 ? '<b class="rk">' + (rank + 1) + '</b>' : '') + (r === 7 ? '<b class="fl">' + FILES.charAt(file) + '</b>' : '') + '<span class="pc"></span></div>';
  }
  boardEl.innerHTML = h; sqEls = {};
  Array.prototype.forEach.call(boardEl.children, function(el){ sqEls[el.getAttribute('data-sq')] = el; el._pc = el.querySelector('.pc'); el._base = el.classList.contains('l') ? 'sq l' : 'sq d'; });
}
function kingSquare(color){
  var b = game.board();
  for(var r = 0; r < 8; r++) for(var c = 0; c < 8; c++){ var p = b[r][c]; if(p && p.type === 'k' && p.color === color) return FILES.charAt(c) + (8 - r); }
  return null;
}
function render(){
  var chk = game.isCheck() ? kingSquare(game.turn()) : null;
  for(var sq in sqEls){
    var el = sqEls[sq], p = game.get(sq), cl = el._base;
    if(lastMove && (sq === lastMove.from || sq === lastMove.to)) cl += ' lm';
    if(hintMv && (sq === hintMv.from || sq === hintMv.to)) cl += ' hnt';
    if(sq === chk) cl += ' chk';
    if(sq === sel) cl += ' sel';
    if(targets[sq]) cl += ' t' + (p ? ' cap' : '');
    if(p && p.color === me && !over) cl += ' mine';
    el.className = cl;
    var t = p ? glyph(p.type) : '', pc = p ? 'pc ' + p.color : 'pc';
    if(el._pc.textContent !== t) el._pc.textContent = t;
    if(el._pc.className !== pc) el._pc.className = pc;
  }
  renderSide();
}
function renderSide(){
  var hist = game.history({verbose:true}), cap = {w:[], b:[]}, pts = {w:0, b:0};
  hist.forEach(function(m){ if(m.captured){ cap[m.color].push(m.captured); pts[m.color] += VAL[m.captured]; } });
  function strip(el, color){
    var order = {q:0, r:1, b:2, n:3, p:4}, list = cap[color].slice().sort(function(a, b){ return order[a] - order[b]; });
    var diff = pts[color] - pts[color === 'w' ? 'b' : 'w'];
    var name = color === me ? 'Você' : 'Astriel · ' + LEVELS[lvIdx].n + ' (' + LEVELS[lvIdx].e + ')';
    el.innerHTML = '<span class="nm"><i class="' + color + '"></i><span>' + name + '</span></span><span class="cap">' +
      list.map(function(t){ return glyph(t); }).join('') + (diff > 0 ? '<em>+' + diff + '</em>' : '') + '</span>';
  }
  strip($('plTop'), flipped ? 'w' : 'b'); strip($('plBot'), flipped ? 'b' : 'w');
  var sans = game.history(), h = '';
  for(var i = 0; i < sans.length; i++){
    if(i % 2 === 0) h += '<span class="mn">' + (i / 2 + 1) + '.</span> ';
    h += '<b' + (i === sans.length - 1 ? ' class="last"' : '') + '>' + sans[i] + '</b> ';
  }
  var mv = $('moves'); mv.innerHTML = h || '<span class="mn">Os lances aparecem aqui.</span>'; mv.scrollTop = mv.scrollHeight;
  var st = $('stat');
  if(over){ st.className = 'stat'; st.textContent = 'Fim de jogo'; }
  else if(thinking){ st.className = 'stat'; st.innerHTML = 'Astriel está pensando<span class="dots"></span>'; }
  else { st.className = 'stat me'; st.textContent = 'Sua vez (' + (me === 'w' ? 'brancas' : 'pretas') + ')' + (game.isCheck() ? ' · você está em xeque!' : ''); }
  $('bUndo').disabled = thinking || !sans.length;
  $('bHint').disabled = thinking || over || game.turn() !== me;
  $('bRes').disabled = over || !sans.length;
}

/* ================= jogadas ================= */
function computeTargets(){
  targets = {};
  if(!sel) return;
  game.moves({square:sel, verbose:true}).forEach(function(m){ (targets[m.to] = targets[m.to] || []).push(m); });
}
function clearSel(){ sel = null; targets = {}; }
function tryMove(from, to){
  var list = targets[to]; if(!list) return;
  if(list.length > 1){ askPromo(from, to); return; }
  doMove(list[0], false);
}
function askPromo(from, to){
  var r = $('mR'); r.innerHTML = ''; $('mT').textContent = 'Promover para'; $('mA').textContent = ''; $('mB').textContent = '';
  ['q', 'r', 'b', 'n'].forEach(function(t){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'pp ' + me; b.textContent = glyph(t);
    b.addEventListener('click', function(){
      modal.classList.remove('show');
      var m = (targets[to] || []).filter(function(x){ return x.promotion === t; })[0];
      if(m) doMove(m, false);
    });
    r.appendChild(b);
  });
  modal.classList.add('show');
}
function doMove(m, byEngine){
  var res;
  try{ res = game.move({from:m.from, to:m.to, promotion:m.promotion}); }catch(e){ return; }
  lastMove = {from:res.from, to:res.to}; hintMv = null; clearSel();
  if(byEngine) engineMoves++;
  render(); save();
  if(checkEnd()) return;
  commentary(res, byEngine);
  render();
  if(!byEngine) maybeEngine();
}
function commentary(m, byEngine){
  var f = m.flags || '';
  if(game.isCheck()) say(byEngine ? pick(['Xeque! Cuida do seu rei.', 'Xeque. Sem pânico, ainda dá pra sair.']) : pick(['Xeque em mim? Ousado.', 'Tô sob ataque! Mas eu aguento.']));
  else if(m.captured) say(byEngine ? pick(['Obrigado pela peça!', 'Essa eu levo.', 'Nham.']) : pick(['Ai! Essa doeu...', 'Boa captura. Eu devia ter olhado melhor.', 'Tá, essa você mereceu.']));
  else if(m.promotion) say(byEngine ? 'Peão virou peça grande. Evolução!' : 'Você coroou um peão... respeito.');
  else if(f.indexOf('k') >= 0 || f.indexOf('q') >= 0) say(byEngine ? 'Roque! Rei seguro, vida longa.' : 'Roque do jogador. Sensato.');
  else if(byEngine && engineMoves % 7 === 0) say(pick(['Hmm, interessante o que você montou aí.', 'Estou calculando mais uma linha... ou fingindo.', 'A posição está ficando divertida.']));
}
function maybeEngine(){
  if(over || thinking || game.turn() === me) return;
  thinking = true; hintMv = null; render();
  var lv = LEVELS[lvIdx], tk = ++gameToken, t0 = Date.now();
  sfSearch({fen:game.fen(), elo:lv.uci || 0, skill:lv.skill, ms:lv.ms, depth:lv.depth}, function(mv){
    setTimeout(function(){
      if(tk !== gameToken) return;
      thinking = false;
      var moves = game.moves({verbose:true}), m = null;
      if(!moves.length) return;
      if(lv.rnd && Math.random() < lv.rnd) m = pick(moves);
      else if(mv && mv !== '(none)') m = moves.filter(function(x){ return x.from + x.to + (x.promotion || '') === mv; })[0];
      doMove(m || pick(moves), true);
    }, Math.max(0, 450 - (Date.now() - t0)));
  });
}

/* ================= fim de jogo ================= */
function openModal(title, a, b, btns){
  $('mT').textContent = title; $('mA').textContent = a; $('mB').textContent = b;
  var r = $('mR'); r.innerHTML = '';
  btns.forEach(function(x){
    var el = document.createElement('button'); el.type = 'button'; el.textContent = x[0]; if(x[2]) el.className = 'pri';
    el.addEventListener('click', function(){ modal.classList.remove('show'); x[1](); });
    r.appendChild(el);
  });
  modal.classList.add('show');
}
function finish(title, sub, line){
  over = true; thinking = false; ++gameToken; cancelSearch(); clearSel(); render(); save();
  say(line);
  setTimeout(function(){
    openModal(title, sub, game.history().length + ' lances · ' + LEVELS[lvIdx].n + ' (' + LEVELS[lvIdx].e + ')',
      [['Ver tabuleiro', function(){}], ['Novo jogo', function(){ newGame(); }, 1]]);
  }, 700);
}
function checkEnd(){
  if(!game.isGameOver()) return false;
  var lv = LEVELS[lvIdx];
  if(game.isCheckmate()){
    var youWin = game.turn() !== me;
    if(youWin) finish('Xeque-mate! Você venceu', 'Parabéns!', lv.magnus ? 'Você derrotou o nível Magnus?! Vou pedir uma revisão do motor.' : 'Xeque-mate. Você jogou melhor. Eu pedi revanche mentalmente.');
    else finish('Xeque-mate! O Astriel venceu', 'Não foi dessa vez.', lv.magnus ? 'Contra o nível Magnus é assim mesmo. Nem ele perdoa. Quer a revanche?' : 'Xeque-mate! Boa partida. Quer a revanche?');
  }
  else if(game.isStalemate()) finish('Empate por afogamento', 'Sem lances legais e sem xeque.', 'Afogamento! Quase ninguém gosta, mas é regra.');
  else if(game.isInsufficientMaterial()) finish('Empate', 'Material insuficiente para o xeque-mate.', 'Sobrou pouca peça. Ninguém consegue dar mate.');
  else if(game.isThreefoldRepetition()) finish('Empate por repetição', 'A mesma posição apareceu 3 vezes.', 'Repetimos tanto que já é tradição. Empate.');
  else finish('Empate', 'Regra dos 50 lances.', 'Cinquenta lances sem captura nem peão. Empate.');
  return true;
}

/* ================= partidas ================= */
function save(){
  try{
    if(over || !game.history().length) localStorage.removeItem(KEY);
    else localStorage.setItem(KEY, JSON.stringify({pgn:game.pgn(), lv:lvIdx, me:me, flipped:flipped}));
  }catch(e){}
}
function loadSaved(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY));
    if(!s || !s.pgn || LEVELS[s.lv] == null) return false;
    var g = new Chess(); g.loadPgn(s.pgn);
    if(g.isGameOver()) return false;
    game = g; lvIdx = s.lv; me = s.me === 'b' ? 'b' : 'w'; flipped = !!s.flipped;
    var h = g.history({verbose:true}); lastMove = h.length ? {from:h[h.length - 1].from, to:h[h.length - 1].to} : null;
    return true;
  }catch(e){ return false; }
}
function newGame(){
  ++gameToken; cancelSearch(); thinking = false; over = false; modal.classList.remove('show');
  lvIdx = +$('selLv').value; var s = $('selSide').value;
  me = s === 'r' ? (Math.random() < .5 ? 'w' : 'b') : s;
  flipped = me === 'b'; game = new Chess(); lastMove = null; hintMv = null; engineMoves = 0; clearSel();
  buildBoard(); render(); save();
  say(LEVELS[lvIdx].intro + (me === 'b' ? ' Eu começo de brancas.' : ' Você começa de brancas.'));
  maybeEngine();
}
function undo(){
  if(thinking || over || !game.history().length) return;
  ++gameToken; game.undo();
  if(game.turn() !== me && game.history().length) game.undo();
  var h = game.history({verbose:true}); lastMove = h.length ? {from:h[h.length - 1].from, to:h[h.length - 1].to} : null;
  hintMv = null; clearSel(); render(); save(); say('Lance desfeito. Eu finjo que não vi.');
  maybeEngine();
}
function hint(){
  if(thinking || over || game.turn() !== me) return;
  var tk = ++gameToken; thinking = true; render(); say('Deixa eu olhar a posição com carinho...');
  sfSearch({fen:game.fen(), skill:20, ms:800}, function(mv){
    if(tk !== gameToken) return;
    thinking = false;
    var m = game.moves({verbose:true}).filter(function(x){ return x.from + x.to + (x.promotion || '') === mv; })[0];
    if(m){ hintMv = {from:m.from, to:m.to}; say('Sugestão: ' + m.san + '. Mas a decisão é sua.'); }
    render();
  });
}
function copyPgn(){
  var p = game.pgn() || '(sem lances ainda)';
  function fb(){ window.prompt('Copie o PGN:', p); }
  try{ navigator.clipboard.writeText(p).then(function(){ say('PGN copiado para a área de transferência.'); }, fb); }catch(e){ fb(); }
}

/* ================= eventos ================= */
boardEl.addEventListener('pointerdown', function(e){
  var el = e.target.closest('.sq');
  if(!el || over || thinking || game.turn() !== me || modal.classList.contains('show')) return;
  var sq = el.getAttribute('data-sq');
  if(sel && targets[sq]){ tryMove(sel, sq); return; }
  var p = game.get(sq);
  if(p && p.color === me){
    sel = sq; computeTargets(); hintMv = null; render();
    drag = {sq:sq, x:e.clientX, y:e.clientY, ghost:null, type:p.type};
    try{ boardEl.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  } else { clearSel(); render(); }
});
boardEl.addEventListener('pointermove', function(e){
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    var g = document.createElement('div'), w = sqEls[drag.sq].getBoundingClientRect().width;
    g.className = 'ghost ' + me; g.textContent = glyph(drag.type); g.style.fontSize = (w * .78) + 'px';
    document.body.appendChild(g); drag.ghost = g; sqEls[drag.sq].classList.add('dragging');
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
});
function endDrag(e, drop){
  if(!drag) return;
  var d = drag; drag = null;
  if(!d.ghost) return;
  d.ghost.remove(); sqEls[d.sq].classList.remove('dragging');
  if(drop){
    var t = document.elementFromPoint(e.clientX, e.clientY), el = t && t.closest ? t.closest('.sq') : null;
    if(el){ var to = el.getAttribute('data-sq'); if(targets[to]) tryMove(d.sq, to); }
  }
}
boardEl.addEventListener('pointerup', function(e){ endDrag(e, true); });
boardEl.addEventListener('pointercancel', function(e){ endDrag(e, false); });
$('bNew').addEventListener('click', function(){
  if(!over && game.history().length > 3 && !window.confirm('Começar um novo jogo? A partida atual será perdida.')) return;
  newGame();
});
$('bUndo').addEventListener('click', undo);
$('bHint').addEventListener('click', hint);
$('bFlip').addEventListener('click', function(){ flipped = !flipped; buildBoard(); render(); save(); });
$('bPgn').addEventListener('click', copyPgn);
$('bRes').addEventListener('click', function(){
  if(over || !game.history().length) return;
  if(!window.confirm('Desistir da partida?')) return;
  finish('Você desistiu', 'O Astriel leva esta.', 'Desistir também é estratégia. Raramente, mas é.');
});

/* ================= início ================= */
(function(){
  var sl = $('selLv'), i;
  for(i = 0; i < LEVELS.length; i++){ var o = document.createElement('option'); o.value = i; o.textContent = LEVELS[i].n + ' (' + LEVELS[i].e + ')'; sl.appendChild(o); }
  sl.value = 2;
  sfInit();
  if(loadSaved()){
    sl.value = lvIdx; $('selSide').value = me;
    buildBoard(); render();
    say('Retomei a partida de onde você parou. O Astriel não esquece nada.');
    maybeEngine();
  } else newGame();
})();
try{ window.focus(); }catch(e){}
})();
</script>
</body></html>
