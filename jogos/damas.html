<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--text:#f7f7f5;--dim:#9a9a9a;--line:rgba(247,247,245,.14);--line-strong:rgba(247,247,245,.32);--g:#4ade80;--red:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 64px 14px 20px;border-bottom:1px solid var(--line);font:700 16px 'Space Grotesk',sans-serif}
.top a{color:var(--dim);text-decoration:none;font:400 14px Inter,sans-serif}.top a:hover{color:var(--text)}
main{max-width:540px;margin:0 auto;padding:14px 16px 28px}
.set{display:grid;grid-template-columns:1.7fr 1fr auto;gap:8px;max-width:520px;margin:0 auto 10px}
.set label{display:flex;flex-direction:column;gap:2px;font:500 10px 'JetBrains Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.set select{width:100%;padding:8px 4px;border:1px solid var(--line);background:#1c1c1c;border-radius:6px;font:600 12px Inter,sans-serif;color:var(--text)}
.set select:focus{outline:none;border-color:var(--g)}
.set button{align-self:end;padding:9px 14px;border:1px solid var(--g);background:rgba(74,222,128,.1);color:var(--g);border-radius:6px;font:600 13px Inter,sans-serif}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:520px;margin:6px auto;min-height:26px;font:500 12px 'JetBrains Mono',monospace;color:var(--dim)}
.pl .nm{display:flex;align-items:center;gap:7px;color:var(--text);min-width:0}
.pl .nm i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line-strong);flex:none}
.pl .nm i.w{background:#f0e6d2}.pl .nm i.b{background:#2a1c14}
.pl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .cap{font:12px/1 'JetBrains Mono',monospace;color:var(--dim)}
.pl .cap em{color:var(--g);font-style:normal;margin-left:4px}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(100%,max(330px,calc(100vh - 320px)));width:min(100%,max(330px,calc(100svh - 320px)));min-width:280px;max-width:520px;aspect-ratio:1;margin:0 auto;border:2px solid var(--line-strong);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;container-type:inline-size}
.sq{min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:default}
.sq.l{background-color:#b9cabe}.sq.d{background-color:#4f6657}
.sq.lm{background-image:linear-gradient(rgba(74,222,128,.42),rgba(74,222,128,.42))}
.sq.sel{background-image:linear-gradient(rgba(74,222,128,.62),rgba(74,222,128,.62))}
.sq.mine{cursor:pointer}
.pc{width:76%;height:76%;border-radius:50%;position:relative;z-index:1;box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 -3px 5px rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.pc.w{background:radial-gradient(circle at 34% 30%,#fff9ef,#e8dcc4 70%,#cdbd98);border:1px solid #8a7a54}
.pc.b{background:radial-gradient(circle at 34% 30%,#4a3326,#2a1c14 70%,#180f0a);border:1px solid #000}
.pc.k::after{content:'★';font-size:max(10px,3.6cqw);color:var(--g);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sq.cap .pc{box-shadow:0 0 0 max(2px,.6cqw) rgba(248,113,113,.8),0 2px 3px rgba(0,0,0,.45)}
.sq.t::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(74,222,128,.55);pointer-events:none}
.sq.t.ocap::after{width:88%;height:88%;background:none;border:max(3px,.9cqw) solid rgba(250,204,21,.6)}
.stat{max-width:520px;margin:10px auto 0;text-align:center;font:500 12px 'JetBrains Mono',monospace;color:var(--dim);min-height:18px}
.stat.me{color:var(--g)}
.stat .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin:8px auto 0}
.tools button{padding:9px 2px;border:1px solid var(--line);background:#1c1c1c;border-radius:8px;font:600 12px Inter,sans-serif;transition:.2s}
.tools button:hover:not(:disabled){border-color:var(--g)}
.tools button:disabled{opacity:.35;cursor:default}
.credit{max-width:520px;margin:14px auto 0;text-align:center;font:400 10px 'JetBrains Mono',monospace;color:#666}
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:22px 24px;text-align:center;max-width:340px;width:100%}
.box h2{margin:0 0 6px;font:700 21px 'Space Grotesk',sans-serif}
.box p{margin:4px 0;color:var(--dim);font-size:14px}
.box .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.box .row button{flex:1;min-width:90px;padding:10px 6px;border-radius:8px;border:1px solid var(--line-strong);background:#1c1c1c;font:600 13px Inter,sans-serif}
.box .row button.pri{border-color:var(--g);color:var(--g);background:rgba(74,222,128,.1)}
@media (max-width:380px){.top{padding-left:14px}.tools button{font-size:11px}}
@media (prefers-reduced-motion:reduce){.stat .dots::after{animation:none;content:'...'}}
/* ===== Astriel — avatar em camadas (mesmo estilo de animação da sinuca) ===== */
.msg{display:flex;gap:12px;align-items:center;max-width:520px;margin:14px auto 0;padding:10px 14px 10px 10px;background:var(--panel);border:1px solid rgba(74,222,128,.3);border-radius:14px;min-height:96px;position:relative}
.msg .tx{min-width:0;flex:1}
.msg .n{display:block;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--g);white-space:nowrap;margin-bottom:3px}
.msg .n small{color:var(--dim);letter-spacing:.04em;text-transform:none;font-size:10.5px;margin-left:4px}
.msg .t{display:block;font-size:14px;line-height:1.5;color:#e3e5e6;min-height:2.9em}
.msg .t.pop{animation:ast-say .28s ease-out}
@keyframes ast-say{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.astriel{--ast-size:84px;position:relative;flex:none;width:var(--ast-size);height:var(--ast-size);isolation:isolate;pointer-events:none;user-select:none;-webkit-user-select:none}
.astriel-orb{position:relative;display:block;width:100%;height:100%;border-radius:50%;animation:ast-float 3.6s ease-in-out infinite}
.astriel-orb::before{content:"";position:absolute;inset:-16%;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(74,222,128,.30),transparent 68%);animation:ast-pulse 2.6s ease-in-out infinite}
.astriel-orb::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:1px dashed rgba(74,222,128,.6);opacity:0;pointer-events:none;animation:ast-spin 14s linear infinite}
.astriel[data-boss="1"] .astriel-orb::after{opacity:1}
.astriel[data-boss="1"] .astriel-orb::before{inset:-26%;background:radial-gradient(circle,rgba(74,222,128,.42),rgba(239,68,68,.14) 56%,transparent 72%);animation-duration:1.6s}
@keyframes ast-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ast-pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.1)}}

.astriel[data-mood="base"] .eye,.astriel[data-mood="bravo"] .eye,.astriel[data-mood="triste"] .eye{opacity:1}
.astriel[data-mood="feliz"] .hap{opacity:1}
.astriel[data-mood="tonto"] .spi,.astriel[data-mood="tonto"] .brow{opacity:1}

/* aura e brilho mudam de cor com o humor */
.astriel[data-mood="feliz"]  .face{filter:drop-shadow(0 0 14px rgba(190,242,100,.85))}
.astriel[data-mood="bravo"]  .face{filter:drop-shadow(0 0 14px rgba(239,68,68,.8))}
.astriel[data-mood="tonto"]  .face{filter:drop-shadow(0 0 14px rgba(168,85,247,.7))}
.astriel[data-mood="triste"] .face{filter:drop-shadow(0 0 10px rgba(96,165,250,.6)) saturate(.8)}
.astriel[data-mood="feliz"]  .eyes{filter:hue-rotate(-32deg) brightness(1.1)}
.astriel[data-mood="bravo"]  .eyes{filter:hue-rotate(-122deg) saturate(1.5) brightness(1.1)}
.astriel[data-mood="tonto"]  .eyes{filter:hue-rotate(160deg) saturate(1.15)}
.astriel[data-mood="triste"] .eyes{filter:hue-rotate(96deg) brightness(.88)}
.astriel[data-mood="feliz"]  .astriel-orb::before{background:radial-gradient(circle,rgba(190,242,100,.34),transparent 68%);animation-duration:1.2s}
.astriel[data-mood="bravo"]  .astriel-orb::before{background:radial-gradient(circle,rgba(239,68,68,.40),transparent 68%);animation-duration:.5s}
.astriel[data-mood="tonto"]  .astriel-orb::before{background:radial-gradient(circle,rgba(168,85,247,.36),transparent 68%);animation-duration:1.4s}
.astriel[data-mood="triste"] .astriel-orb::before{background:radial-gradient(circle,rgba(96,165,250,.28),transparent 68%);animation-duration:5s}
.astriel[data-mood="bravo"]  .astriel-orb{animation:ast-shake .18s linear infinite}
.astriel[data-mood="tonto"]  .astriel-orb{animation:ast-dizzy 1.1s ease-in-out infinite}
.astriel[data-mood="feliz"]  .astriel-orb{animation:ast-hop .6s ease-in-out infinite}
.astriel[data-mood="triste"] .astriel-orb{animation-duration:7s}
@keyframes ast-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes ast-dizzy{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-4px)}}
@keyframes ast-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ast-spin{to{transform:rotate(360deg)}}

/* NORMAL: pisca de tempos em tempos e olha de lado */
.astriel[data-mood="base"] .eyes{animation:ast-glance 9s ease-in-out infinite}
.astriel[data-mood="base"] .eye{animation:ast-blink 4.6s infinite}
@keyframes ast-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.07)}}
@keyframes ast-glance{0%,16%,100%{transform:translateX(0)}24%,42%{transform:translateX(-3%)}50%,68%{transform:translateX(3%)}76%{transform:translateX(0)}}

/* FELIZ: olhinhos em arco sobem e "sorriem" no ritmo do pulinho + brilhinhos */
.astriel[data-mood="feliz"] .hap{animation:ast-smile .6s ease-in-out infinite}
@keyframes ast-smile{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-9%) scale(1.06,1.2)}}
.astriel .spark{background:#ecfccb;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0}
.astriel .spark.a{width:15%;height:15%;right:-2%;top:0}
.astriel .spark.b{width:11%;height:11%;left:-3%;top:26%}
.astriel .spark.c{width:9%;height:9%;right:-5%;top:56%}
.astriel[data-mood="feliz"] .spark{animation:ast-twinkle 1.2s ease-in-out infinite}
.astriel[data-mood="feliz"] .spark.b{animation-delay:-.4s}
.astriel[data-mood="feliz"] .spark.c{animation-delay:-.8s}
@keyframes ast-twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* BRAVO: encara com as sobrancelhas "caídas", FECHA os olhos apertando, segura e reabre de estalo + vapor */
.astriel[data-mood="bravo"] .eye.l{--rot:11deg;--dx:7%}
.astriel[data-mood="bravo"] .eye.r{--rot:-11deg;--dx:-7%}
.astriel[data-mood="bravo"] .eye{animation:ast-squeeze 2.4s ease-in-out infinite}
@keyframes ast-squeeze{
  0%,10%{transform:rotate(var(--rot)) translate(0,0) scale(1,.82)}
  22%,52%{transform:rotate(var(--rot)) translate(var(--dx),12%) scale(1.04,.07)}
  60%{transform:rotate(var(--rot)) translate(0,0) scale(1.05,1)}
  68%,100%{transform:rotate(var(--rot)) translate(0,0) scale(1,.82)}
}
.astriel .steam{width:15%;height:15%;border-radius:50%;background:radial-gradient(circle,rgba(252,165,165,.85),rgba(239,68,68,0) 70%);opacity:0;top:2%}
.astriel .steam.l{left:6%}.astriel .steam.r{right:6%}
.astriel[data-mood="bravo"] .steam{animation:ast-steam .9s ease-out infinite}
.astriel[data-mood="bravo"] .steam.r{animation-delay:-.45s}
@keyframes ast-steam{0%{opacity:0;transform:translateY(40%) scale(.4)}30%{opacity:.9}100%{opacity:0;transform:translateY(-130%) scale(1.5)}}

/* TONTO: espirais girando em sentidos opostos, sobrancelhas tremendo e estrelinhas orbitando */
.astriel[data-mood="tonto"] .spi.l{animation:ast-spin 1.3s linear infinite}
.astriel[data-mood="tonto"] .spi.r{animation:ast-spin 1.3s linear infinite reverse}
.astriel[data-mood="tonto"] .brow.l{animation:ast-brow 1.1s ease-in-out infinite}
.astriel[data-mood="tonto"] .brow.r{animation:ast-browr 1.1s ease-in-out infinite;animation-delay:-.55s}
@keyframes ast-brow{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22%) rotate(5deg)}}
@keyframes ast-browr{0%,100%{transform:scaleX(-1) translateY(0) rotate(-4deg)}50%{transform:scaleX(-1) translateY(-22%) rotate(5deg)}}
.astriel .star{width:13%;height:13%;left:43.5%;top:-3.5%;background:#fde68a;opacity:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.astriel[data-mood="tonto"] .star{animation:ast-orbit 1.8s linear infinite}
.astriel[data-mood="tonto"] .star.s2{animation-delay:-.6s}
.astriel[data-mood="tonto"] .star.s3{animation-delay:-1.2s}
@keyframes ast-orbit{0%{transform:translate(269%,0%) scale(.88);opacity:.73}6.25%{transform:translate(249%,21%) scale(.98);opacity:.83}12.5%{transform:translate(190%,38%) scale(1.07);opacity:.92}18.75%{transform:translate(103%,50%) scale(1.13);opacity:.98}25%{transform:translate(0%,54%) scale(1.15);opacity:1}31.25%{transform:translate(-103%,50%) scale(1.13);opacity:.98}37.5%{transform:translate(-190%,38%) scale(1.07);opacity:.92}43.75%{transform:translate(-249%,21%) scale(.98);opacity:.83}50%{transform:translate(-269%,0%) scale(.88);opacity:.73}56.25%{transform:translate(-249%,-21%) scale(.77);opacity:.62}62.5%{transform:translate(-190%,-38%) scale(.68);opacity:.53}68.75%{transform:translate(-103%,-50%) scale(.62);opacity:.47}75%{transform:translate(0%,-54%) scale(.6);opacity:.45}81.25%{transform:translate(103%,-50%) scale(.62);opacity:.47}87.5%{transform:translate(190%,-38%) scale(.68);opacity:.53}93.75%{transform:translate(249%,-21%) scale(.77);opacity:.62}100%{transform:translate(269%,0%) scale(.88);opacity:.72}}

/* TRISTE: olhos caem devagar (cantos internos para cima) e lágrimas escorrem */
.astriel[data-mood="triste"] .eye.l{--rot:-13deg}
.astriel[data-mood="triste"] .eye.r{--rot:13deg}
.astriel[data-mood="triste"] .eye{animation:ast-droop 3.2s ease-in-out infinite}
@keyframes ast-droop{0%,100%{transform:rotate(var(--rot)) translateY(0) scale(1,1);opacity:1}50%{transform:rotate(var(--rot)) translateY(7%) scale(1,.86);opacity:.85}}
.astriel .tear{width:6.5%;height:6.5%;top:55%;border-radius:0 50% 50% 50%;background:radial-gradient(circle at 35% 35%,#e0f2fe,#60a5fa 60%,#3b82f6);box-shadow:0 0 5px rgba(96,165,250,.8);opacity:0}
.astriel .tear.l{left:27%}.astriel .tear.r{right:27%}
.astriel[data-mood="triste"] .tear{animation:ast-tear 2.6s ease-in infinite}
.astriel[data-mood="triste"] .tear.r{animation-delay:-1.3s}
@keyframes ast-tear{0%,8%{opacity:0;transform:translateY(0) rotate(45deg) scale(.3)}24%{opacity:1;transform:translateY(0) rotate(45deg) scale(1)}85%{opacity:.9;transform:translateY(300%) rotate(45deg) scale(1)}100%{opacity:0;transform:translateY(390%) rotate(45deg) scale(.9)}}

@media (max-width:560px){.astriel{--ast-size:68px}.msg{min-height:84px;gap:10px}}
@media (prefers-reduced-motion:reduce){
  .astriel-orb,.astriel-orb::before,.astriel-orb::after,.astriel[data-mood] .astriel-orb,.astriel .eyes,.astriel .eye,.astriel .hap,.astriel .spi,.astriel .brow,.astriel .fx{animation:none!important}
  .astriel .fx{display:none}
  .msg .t.pop{animation:none}
}

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var boardEl = $('board'), msgEl = $('msg'), statEl = $('stat'), modal = $('modal');
var DEPTH = {1:2, 2:4, 3:6};
var sqEls = [];

function idx(r,c){ return r*8+c; }
function inb(r,c){ return r>=0 && r<8 && c>=0 && c<8; }
function owner(p){ if(!p) return null; return (p==='w'||p==='W') ? 'w' : 'b'; }
function isKing(p){ return p==='W' || p==='B'; }

function initial(){
  var b = new Array(64).fill(null);
  for(var r=0;r<3;r++) for(var c=0;c<8;c++) if((r+c)%2===1) b[idx(r,c)]='b';
  for(var r2=5;r2<8;r2++) for(var c2=0;c2<8;c2++) if((r2+c2)%2===1) b[idx(r2,c2)]='w';
  return b;
}

var DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];

/* gera sequencias de captura a partir de r,c (recursivo), board mutado em copias */
function captureSeqs(board, r, c){
  var p = board[idx(r,c)], o = owner(p), king = isKing(p), seqs = [];
  DIRS.forEach(function(d){
    if(king){
      var cr=r+d[0], cc=c+d[1], jumped=null;
      while(inb(cr,cc) && !board[idx(cr,cc)]){ cr+=d[0]; cc+=d[1]; }
      if(inb(cr,cc) && board[idx(cr,cc)] && owner(board[idx(cr,cc)])!==o){
        jumped = idx(cr,cc);
        var lr=cr+d[0], lc=cc+d[1];
        while(inb(lr,lc) && !board[idx(lr,lc)]){
          var nb = board.slice();
          nb[idx(r,c)]=null; nb[jumped]=null;
          var np = p;
          nb[idx(lr,lc)] = np;
          var sub = captureSeqs(nb, lr, lc);
          if(sub.length){
            sub.forEach(function(s){ seqs.push({to:idx(lr,lc), cap:jumped, promote:false, board:nb, chain:[{to:idx(lr,lc),cap:jumped}].concat(s.chain), final:s.final}); });
          } else {
            seqs.push({to:idx(lr,lc), cap:jumped, promote:false, board:nb, chain:[{to:idx(lr,lc),cap:jumped}], final:nb});
          }
          lr+=d[0]; lc+=d[1];
        }
      }
    } else {
      var mr=r+d[0], mc=c+d[1], lr2=r+2*d[0], lc2=c+2*d[1];
      if(inb(mr,mc) && inb(lr2,lc2) && board[idx(mr,mc)] && owner(board[idx(mr,mc)])!==o && !board[idx(lr2,lc2)]){
        var jcap = idx(mr,mc);
        var nb2 = board.slice();
        nb2[idx(r,c)]=null; nb2[jcap]=null;
        var promo = (o==='w' && lr2===0) || (o==='b' && lr2===7);
        var np2 = promo ? (o==='w'?'W':'B') : p;
        nb2[idx(lr2,lc2)] = np2;
        var sub2 = promo ? [] : captureSeqs(nb2, lr2, lc2);
        if(sub2.length){
          sub2.forEach(function(s){ seqs.push({to:idx(lr2,lc2), cap:jcap, promote:promo, board:nb2, chain:[{to:idx(lr2,lc2),cap:jcap}].concat(s.chain), final:s.final}); });
        } else {
          seqs.push({to:idx(lr2,lc2), cap:jcap, promote:promo, board:nb2, chain:[{to:idx(lr2,lc2),cap:jcap}], final:nb2});
        }
      }
    }
  });
  return seqs;
}

function simpleMoves(board, r, c){
  var p = board[idx(r,c)], king = isKing(p), o = owner(p), out = [];
  DIRS.forEach(function(d){
    if(king){
      var cr=r+d[0], cc=c+d[1];
      while(inb(cr,cc) && !board[idx(cr,cc)]){
        out.push({to:idx(cr,cc)});
        cr+=d[0]; cc+=d[1];
      }
    } else {
      var fwd = (o==='w') ? -1 : 1;
      if(d[0]===fwd){
        var nr=r+d[0], nc=c+d[1];
        if(inb(nr,nc) && !board[idx(nr,nc)]) out.push({to:idx(nr,nc)});
      }
    }
  });
  return out;
}

function allMoves(board, color){
  var caps = [], moves = [];
  for(var i=0;i<64;i++){
    var p = board[i]; if(!p || owner(p)!==color) continue;
    var r=(i/8)|0, c=i%8;
    var cs = captureSeqs(board, r, c);
    cs.forEach(function(s){ caps.push({from:i, chain:s.chain, final:s.final}); });
  }
  if(caps.length) return {caps:caps, forced:true};
  for(var j=0;j<64;j++){
    var p2 = board[j]; if(!p2 || owner(p2)!==color) continue;
    var r2=(j/8)|0, c2=j%8;
    simpleMoves(board, r2, c2).forEach(function(m){
      var nb = board.slice(); var piece = nb[j]; nb[j]=null;
      var to = m.to, tr=(to/8)|0;
      var promo = (owner(piece)==='w' && tr===0) || (owner(piece)==='b' && tr===7);
      nb[to] = promo ? (owner(piece)==='w'?'W':'B') : piece;
      moves.push({from:j, chain:[{to:to,cap:null}], final:nb});
    });
  }
  return {caps:[], moves:moves, forced:false};
}

function legalMoves(board, color){
  var all = allMoves(board, color);
  return all.forced ? all.caps : all.moves;
}

/* ---------- avaliacao / IA ---------- */
function evalBoard(board, color){
  var sc = 0;
  for(var i=0;i<64;i++){
    var p = board[i]; if(!p) continue;
    var r=(i/8)|0;
    var v = isKing(p) ? 300 : 100;
    if(!isKing(p)) v += (owner(p)==='w') ? (7-r)*2 : r*2;
    sc += (owner(p)===color) ? v : -v;
  }
  return sc;
}
var nodeCount = 0;
function minimax(board, color, turn, depth, alpha, beta){
  nodeCount++;
  var moves = legalMoves(board, turn);
  if(!moves.length) return turn===color ? -100000 : 100000;
  if(depth===0 || nodeCount>60000) return evalBoard(board, color);
  var other = turn==='w'?'b':'w';
  if(turn===color){
    var best = -Infinity;
    for(var i=0;i<moves.length;i++){
      var v = minimax(moves[i].final, color, other, depth-1, alpha, beta);
      if(v>best) best=v;
      if(v>alpha) alpha=v;
      if(alpha>=beta) break;
    }
    return best;
  } else {
    var best2 = Infinity;
    for(var j=0;j<moves.length;j++){
      var v2 = minimax(moves[j].final, color, other, depth-1, alpha, beta);
      if(v2<best2) best2=v2;
      if(v2<beta) beta=v2;
      if(alpha>=beta) break;
    }
    return best2;
  }
}
function pickBest(board, color, depth){
  var moves = legalMoves(board, color);
  if(!moves.length) return null;
  nodeCount = 0;
  var best = -Infinity, bm = [], other = color==='w'?'b':'w';
  moves.forEach(function(m){
    var v = minimax(m.final, color, other, depth-1, -Infinity, Infinity);
    if(v>best){ best=v; bm=[m]; } else if(v===best) bm.push(m);
  });
  return bm[(Math.random()*bm.length)|0];
}

/* ---------- estado do jogo ---------- */
var board, turn, human, ai, selSq, availMoves, hist, over, lvl, flipped, thinking;
var states = [], quiet = 0, keys = [], lastEv = null, evNote = null, lastMateAnn = 0, gameToken = 0, nagAt = 0, flagA = false, flagB = false;

function pick(a){ return a[(Math.random()*a.length)|0]; }
var astEl = $('astriel'), astMt = null;
function mood(m, ms){ clearTimeout(astMt); astEl.setAttribute('data-mood', m); if(ms && m !== 'base') astMt = setTimeout(function(){ astEl.setAttribute('data-mood', 'base'); }, ms); }
function say(t, m, ms){ msgEl.textContent = t; msgEl.classList.remove('pop'); void msgEl.offsetWidth; msgEl.classList.add('pop'); if(m) mood(m, ms || 2400); }

(function(){

          var t=ry[0], promo=(p===1&&(t>>3)===0)||(p===-1&&(t>>3)===7);
          out.push(new Mv(sq,t,null,null,p,promo?(p>0?2:-2):p));
        }
      }
    }
  }
  return out;
}
function make(m){
  var b=board, p=m.p, f=m.f, t=m.t;
  b[f]=0; hA^=ZA[ptIdx(p,f)]; hB^=ZB[ptIdx(p,f)];
  if(m.caps){ for(var i=0;i<m.caps.length;i++){ var s=m.caps[i], v=m.cv[i]; b[s]=0; hA^=ZA[ptIdx(v,s)]; hB^=ZB[ptIdx(v,s)]; } }
  b[t]=m.np; hA^=ZA[ptIdx(m.np,t)]; hB^=ZB[ptIdx(m.np,t)];
  hA^=ZSA; hB^=ZSB;
}
function unmake(m){
  var b=board;
  b[m.t]=0;
  if(m.caps){ for(var i=0;i<m.caps.length;i++) b[m.caps[i]]=m.cv[i]; }
  b[m.f]=m.p;
}

/* ---------- avaliação (pontos de vista das brancas) ---------- */
function evaluate(){
  var s=0, wm=0, bm=0, wk=0, bk=0, mob=0, sq, p;
  for(sq=0;sq<64;sq++){
    p=board[sq]; if(p===0) continue;
    if(p===1){ wm++; s+=MAN+PST_W[sq]; if(board[sq-9]===0&&sq>8&&(sq&7)>0) mob++; if(board[sq-7]===0&&sq>7&&(sq&7)<7) mob++; }
    else if(p===-1){ bm++; s-=MAN+PST_B[sq]; if(sq<55&&(sq&7)<7&&board[sq+9]===0) mob--; if(sq<56&&(sq&7)>0&&board[sq+7]===0) mob--; }
    else if(p===2){ wk++; s+=KING+PST_K[sq]; }
    else { bk++; s-=KING+PST_K[sq]; }
  }
  s+=mob*2;
  var tot=wm+bm+wk+bk;
  /* finais: dama vale um pouco menos e a vantagem pesa mais */
  if(tot<=8 && (wk+bk)>0){
    var diff=(wm+wk)-(bm+bk);
    s+=diff*12;
    if(wm===0&&bm===0){          /* só damas: buscar o centro/diagonal e não perder tempo */
      var wd=0,bd=0; for(sq=0;sq<64;sq++){ if(board[sq]===2&&(SQ_R[sq]+SQ_C[sq]===7)) wd++; if(board[sq]===-2&&(SQ_R[sq]+SQ_C[sq]===7)) bd++; }
      s+=(wd-bd)*10;
    }
  }
  return s;
}

/* ---------- repetição ---------- */
function isRep(cur,quiet){
  for(var i=cur-2;i>=0&&i>=cur-quiet;i-=2) if(hpA[i]===hA&&hpB[i]===hB) return true;
  return false;
}

/* ---------- busca ---------- */
function orderMoves(moves,ttMove,ply){
  var k1=killers[ply*2], k2=killers[ply*2+1];
  for(var i=0;i<moves.length;i++){
    var m=moves[i], sc=0, key=m.f*64+m.t;
    if(ttMove>=0 && key===ttMove) sc=1e6;
    else if(m.caps){ sc=1000+m.caps.length*100; }
    else {
      if(m.np!==m.p) sc=900;
      else if(key===k1) sc=800; else if(key===k2) sc=700;
      else sc=history[key]; /* <700 */
      if(sc>690) sc=690;
    }
    m.sc=sc;
  }
  /* inserção (listas curtas) */
  for(var a=1;a<moves.length;a++){ var x=moves[a], j=a-1; while(j>=0&&moves[j].sc<x.sc){ moves[j+1]=moves[j]; j--; } moves[j+1]=x; }
}
function ab(d,alpha,beta,ply,turn,quiet,ext){
  nodes++;
  if((nodes&1023)===0 && now()>deadline) aborted=true;
  if(aborted) return 0;
  if(quiet>=40) return 0;
  var cur=hLen+ply;
  if(ply>0 && isRep(cur,quiet)) return 0;
  hpA[cur]=hA; hpB[cur]=hB;
  if(ply>maxDepthReached) maxDepthReached=ply;
  var alpha0=alpha, idx=hA&TT_MASK, ttMove=-1;
  if(ttB[idx]===hB && ttF[idx]!==0){
    ttMove=ttM[idx];
    if(ttD[idx]>=d && ply>0){
      var ts=ttS[idx]; if(ts>MATE-200) ts-=ply; else if(ts<-MATE+200) ts+=ply;
      var fl=ttF[idx];
      if(fl===1) return ts;
      if(fl===2){ if(ts>alpha) alpha=ts; } else if(fl===3){ if(ts<beta) beta=ts; }
      if(alpha>=beta) return ts;
    }
  }
  var moves=gen(turn), n=moves.length;
  if(n===0) return -MATE+ply;
  var forced=moves[0].caps!==null;
  if(d<=0){
    if(!forced || ply>=MAXPLY-2){ var e=evaluate(); return turn>0?e:-e; }
  }
  if(n===1 && ext<MAXEXT){ d++; ext++; }
  if(n>1) orderMoves(moves,ttMove,ply); else moves[0].sc=0;
  var best=-1e9, bestKey=-1, hA0=hA, hB0=hB, first=true;
  for(var i=0;i<n;i++){
    var m=moves[i];
    make(m);
    var nq=(m.caps||m.p===1||m.p===-1)?0:quiet+1, v;
    if(first){ v=-ab(d-1,-beta,-alpha,ply+1,-turn,nq,ext); }
    else {
      v=-ab(d-1,-alpha-1,-alpha,ply+1,-turn,nq,ext);
      if(v>alpha && v<beta && !aborted) v=-ab(d-1,-beta,-alpha,ply+1,-turn,nq,ext);
    }
    unmake(m); hA=hA0; hB=hB0;
    if(aborted) return 0;
    first=false;
    if(v>best){ best=v; bestKey=m.f*64+m.t; }
    if(v>alpha){ alpha=v;
      if(alpha>=beta){
        if(!m.caps){ var k=m.f*64+m.t; if(killers[ply*2]!==k){ killers[ply*2+1]=killers[ply*2]; killers[ply*2]=k; } history[k]+=d*d; if(history[k]>5e5) for(var z=0;z<4096;z++) history[z]>>=1; }
        break;
      }
    }
  }
  /* guardar na TT */
  var fl2=best<=alpha0?3:(best>=beta?2:1), sv=best;
  if(sv>MATE-200) sv+=ply; else if(sv<-MATE+200) sv-=ply;
  if(ttF[idx]===0 || ttAge[idx]!==age || ttD[idx]<=d){ ttB[idx]=hB0; ttD[idx]=d>127?127:d; ttF[idx]=fl2; ttS[idx]=sv; ttM[idx]=bestKey; ttAge[idx]=age; }
  return best;
}

function load(ints,turn){
  for(var i=0;i<64;i++) board[i]=ints[i];
  computeHash(turn);
}
/* ints: 64 valores (1 branca, 2 dama branca, -1 preta, -2 dama preta). turn: 1 brancas / -1 pretas.
   quiet: plies seguidos só de damas sem captura. hist: tabuleiros anteriores (mais antigo primeiro) desde o último lance irreversível. */
function think(ints,turn,quiet,hist,timeMs,maxDepth,onInfo){
  age=(age+1)&255;
  killers=new Array(MAXPLY*2+4).fill(-1);
  history.fill(0);
  hLen=0;
  var hs=hist||[];
  for(var h=0;h<hs.length;h++){ load(hs[h].b,hs[h].t); hpA[hLen]=hA; hpB[hLen]=hB; hLen++; }
  load(ints,turn);
  var root=gen(turn);
  if(!root.length) return null;
  var t0=now(); deadline=t0+timeMs; aborted=false; nodes=0;
  var bestMove=root[0], bestScore=0, doneDepth=0;
  if(root.length===1){ var f1=Array.from(board), m1=root[0]; f1[m1.f]=0; if(m1.caps) for(var c1=0;c1<m1.caps.length;c1++) f1[m1.caps[c1]]=0; f1[m1.t]=m1.np; return {m:m1,final:f1,score:0,depth:0,nodes:1,forced:true}; }
  var forcedCap=root[0].caps!==null;
  /* variedade na abertura: embaralha os lances da raiz */
  var pieces=0; for(var q=0;q<64;q++) if(board[q]) pieces++;
  if(pieces>=22) for(var s=root.length-1;s>0;s--){ var r=(Math.random()*(s+1))|0, tmp=root[s]; root[s]=root[r]; root[r]=tmp; }
  hpA[hLen]=hA; hpB[hLen]=hB;
  var rootA=hA, rootB=hB;
  for(var depth=1;depth<=(maxDepth||64);depth++){
    var alpha=-MATE-1, beta=MATE+1, iterBest=null, iterScore=-1e9, first=true, ttMove=bestMove.f*64+bestMove.t;
    maxDepthReached=0;
    /* melhor lance anterior primeiro */
    var ordered=root.slice();
    ordered.sort(function(a,b){ return ((b===bestMove)?1:0)-((a===bestMove)?1:0); });
    for(var i=0;i<ordered.length;i++){
      var m=ordered[i];
      make(m);
      var nq=(m.caps||m.p===1||m.p===-1)?0:quiet+1, v;
      if(first) v=-ab(depth-1,-beta,-alpha,1,-turn,nq,0);
      else { v=-ab(depth-1,-alpha-1,-alpha,1,-turn,nq,0); if(v>alpha&&v<beta&&!aborted) v=-ab(depth-1,-beta,-alpha,1,-turn,nq,0); }
      unmake(m); hA=rootA; hB=rootB;
      if(aborted) break;
      first=false;
      if(v>iterScore){ iterScore=v; iterBest=m; }
      if(v>alpha) alpha=v;
    }
    if(aborted){
      /* iteração parcial: só vale se algum lance já foi provado melhor que o anterior (lance anterior é sempre o 1º) */
      if(iterBest!==null){ bestMove=iterBest; bestScore=iterScore; }
      break;
    }
    bestMove=iterBest; bestScore=iterScore; doneDepth=depth;
    if(onInfo) onInfo({depth:depth,score:bestScore,nodes:nodes,ms:now()-t0});
    if(Math.abs(bestScore)>MATE-100 && depth>=Math.abs(MATE-Math.abs(bestScore))+2) break;
  }
  load(ints,turn);
  var fb=Array.from(board); fb[bestMove.f]=0; if(bestMove.caps) for(var kk=0;kk<bestMove.caps.length;kk++) fb[bestMove.caps[kk]]=0; fb[bestMove.t]=bestMove.np;
  return {m:bestMove,final:fb,score:bestScore,depth:doneDepth,nodes:nodes,forced:false,ms:now()-t0};
}

/* utilitários para testes e para a página */
function movesFinal(ints,turn){
  load(ints,turn);
  var mv=gen(turn), res=[];
  for(var i=0;i<mv.length;i++){
    var m=mv[i], b=Int8Array.from(board);
    b[m.f]=0; if(m.caps) for(var k=0;k<m.caps.length;k++) b[m.caps[k]]=0; b[m.t]=m.np;
    res.push({f:m.f,t:m.t,final:Array.from(b)});
  }
  return res;
}
function clearTT(){ ttF.fill(0); ttB.fill(0); }
return {think:think, movesFinal:movesFinal, clearTT:clearTT, evaluate:function(ints){ load(ints,1); return evaluate(); }};
})();
if(typeof module!=='undefined') module.exports=AstrielEngine;

</script>
